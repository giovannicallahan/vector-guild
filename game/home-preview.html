<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081114"><title>MathCosmos — Home (preview)</title>
<link rel="stylesheet" href="shell/shell.css"><link rel="stylesheet" href="shell/home.css"><link rel="stylesheet" href="collection/collection.css"></head>
<body>
<!-- Standalone test page for shell/home.js: the home view without the wormhole.
     ?flat=1 mounts it without three.js (SVG glyphs). ?reduced=1 forces reduced motion.
     The Collection button is the real one (it opens the overlay); the other two only say what they would do. -->
<div id="home"></div>
<script src="realms/registry.js"></script>
<script src="save-store.js"></script>
<script src="collection/figures.js"></script>
<script src="collection/achievements.js"></script>
<script src="collection/core.js"></script>
<script src="collection/ui.js"></script>
<script src="shell/vendor/three.min.js"></script>
<script src="shell/home.js"></script>
<script>
(function(){
  var q=location.search,flat=/[?&]flat=1(&|$)/.test(q),reduced=/[?&]reduced=1(&|$)/.test(q);
  var opts={realms:window.VG_REALMS,save:window.VGSave,three:flat?null:window.THREE,
    actions:[{label:'Collection',place:'top',className:'vg-coll',setup:function(b){if(window.VGCollectionUI)window.VGCollectionUI.chip(b,{label:'Collection'})}},
             {label:'Replay intro',onClick:function(){alert('Replay intro (preview only)')}},
             {label:'Back up or restore save',onClick:function(){alert('Backup (preview only)')}}]};
  if(reduced)opts.reducedMotion=true;
  window.VGHome.mount(document.getElementById('home'),opts);
  /* The Android wrapper calls this on Back: true means the page handled it. */
  window.VectorGuildBack=function(){return window.VGHome.back()}; /* the open overlay puts itself in front of this */
})();
</script>
</body></html>
